      width: 6px;

      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-toast {
      animation: slideIn 0.3s ease-out forwards;
    }

    .no-scrollbar::-webkit-scrollbar {

    }

    .no-scrollbar {
      -ms-overflow-style: none;

          { id: 'm4d11', name: 'D11: R3 Compuesta', url: 'https://profemarlon.com/modulo_4/mod4_diapositiva11.html', desc: 'Complejidad multiple en R3.' },
          { id: 'm4d12', name: 'D12: Casos R3C', url: 'https://profemarlon.com/modulo_4/mod4_diapositiva12.html', desc: 'Resolución problemas compuestos.' },
        ]

          { id: 'm5d4', name: 'D4: S. Internacional', url: 'https://profemarlon.com/modulo_5/mod5_diapositiva4.html', desc: 'Unidades SI y prefijos.' },
          { id: 'm5d5', name: 'D5: Aplicaciones', url: 'https://profemarlon.com/modulo_5/mod5_diapositiva5.html', desc: 'Uso en programas académicos.' },
          { id: 'm5d6', name: 'D6: S. Imperial', url: 'https://profemarlon.com/modulo_5/mod5_diapositiva6.html', desc: 'Unidades del sistema inglés.' },
          { id: 'm5d7', name: 'D7: Conver. Dual', url: 'https://profemarlon.com/modulo_5/mod5_diapositiva7.html', desc: 'Conversión SI vs Imperial.' },
          { id: 'm5d8', name: 'D8: Contextos', url: 'https://profemarlon.com/modulo_5/mod5_diapositiva8.html', desc: 'Ejemplos prácticos finales.' },
        ]
      },
      {
        module: 6, title: 'Potenciación y Radicación', slides: [
          { id: 'm6d1', name: 'D1: Intro M6', url: 'https://profemarlon.com/modulo_6/mod6_diapositiva1.html', desc: 'Fundamentos de potencias.' },
          { id: 'm6d2', name: 'D2: Relevancia', url: 'https://profemarlon.com/modulo_6/mod6_diapositiva2.html', desc: 'Importancia en cálculos.' },

          { id: 'm6d5', name: 'D5: Practica', url: 'https://profemarlon.com/modulo_6/mod6_diapositiva5.html', desc: 'Ejercicios de potencia.' },

          { id: 'm6d10', name: 'D10: Polinomios', url: 'https://profemarlon.com/modulo_6/mod6_diapositiva10.html', desc: 'Aplicación en polinomios.' },

    // Functions
    function createCard(item, category) {
      const icon = category === 'flashcards' ? 'copy' : 'gamepad-2';
      return `
                <div class="glass-card p-5 rounded-2xl flex flex-col justify-between">
                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-2">
                             <span class="text-[10px] bg-primary-teal/20 text-primary-lightTeal px-2 py-1 rounded-full uppercase tracking-widest font-bold">${category}</span>
                             <i data-lucide="${icon}" class="w-4 h-4 text-slate-500"></i>
                        </div>
                        <h4 class="font-bold text-lg leading-tight mb-2">${item.name}</h4>
                        <div class="bg-black/20 p-2 rounded-lg text-[10px] font-mono text-slate-500 break-all mb-2 flex justify-between items-center group">
                            <span class="truncate pr-2">${item.url}</span>
                            <button onclick="copyToClipboard('${item.url}', '${item.id}')" class="text-primary-lightTeal hover:text-white transition-colors">
                                <i data-lucide="copy" class="w-3 h-3"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <a href="${item.url}" target="_blank" class="flex-1 bg-primary-teal hover:bg-primary-lightTeal text-white text-xs font-bold py-2.5 rounded-xl text-center transition-all flex items-center justify-center">
                            <i data-lucide="external-link" class="w-3.5 h-3.5 mr-2"></i>
                            Ver Ahora
                        </a>
                        <button onclick="copyToClipboard('${item.url}', '${item.id}')" class="p-2.5 rounded-xl border border-white/10 hover:bg-white/5 transition-all group overflow-hidden relative">
                            <i data-lucide="clipboard" class="w-4 h-4 text-slate-400 group-hover:text-accent-amber transition-colors"></i>
                        </button>
                    </div>
                </div>
            `;
    }

    function createModuleSection(moduleData) {
      return `
                <div>
                    <h4 class="text-primary-lightTeal font-bold flex items-center mb-4 text-lg">
                        <span class="w-8 h-8 rounded-lg bg-teal-500/10 flex items-center justify-center mr-3 text-sm">${moduleData.module}</span>
                        ${moduleData.title}
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pl-0">
                        ${moduleData.slides.map(slide => `
                            <div class="glass p-4 rounded-xl relative group">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Slide ${slide.id.split('d')[1]}</span>
                                    <button onclick="copyToClipboard('${slide.url}', '${slide.id}')" class="text-slate-500 hover:text-accent-amber transition-colors">
                                        <i data-lucide="link-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                                <h5 class="text-sm font-bold mb-1 truncate">${slide.name}</h5>
                                <p class="text-[11px] text-slate-400 leading-tight mb-3 h-8 overflow-hidden line-clamp-2">${slide.desc}</p>
                                <a href="${slide.url}" target="_blank" class="text-xs text-primary-lightTeal flex items-center hover:opacity-80">
                                    Abrir contenido <i data-lucide="chevron-right" class="w-3 h-3 ml-1"></i>
                                </a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
    }

    function switchTab(tabId) {
      // Hide all contents
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      // Remove active classes from sidebar
      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.remove('sidebar-item-active', 'text-white');
        el.classList.add('text-slate-400');
      });

      // Show selected content
      document.getElementById(`content-${tabId}`).classList.remove('hidden');
      // Update sidebar
      const activeLink = document.getElementById(`side-${tabId}`);
      if (activeLink) {
        activeLink.classList.add('sidebar-item-active', 'text-white');
        activeLink.classList.remove('text-slate-400');
      }

      // Update mobile tabs
      document.querySelectorAll('.mobile-tab').forEach(el => {
        el.classList.remove('bg-primary-teal', 'text-white');
        el.classList.add('text-slate-400');
      });
      const activeTab = document.getElementById(`tab-${tabId}`);
      if (activeTab) {
        activeTab.classList.add('bg-primary-teal', 'text-white');
        activeTab.classList.remove('text-slate-400');
      }

      // Update title
      const tabTitle = document.getElementById('tab-title');
      const icons = { 'dashboard': 'layout-grid', 'flashcards': 'copy', 'games': 'gamepad-2', 'modules': 'book-open', 'maps': 'map' };
      const names = { 'dashboard': 'Vista General', 'flashcards': 'Flashcards Educativos', 'games': 'Módulos Gamificados', 'modules': 'Material de Estudio', 'maps': 'Mapas Conceptuales' };

      tabTitle.innerHTML = `<i data-lucide="${icons[tabId]}" class="w-5 h-5 mr-3 text-primary-lightTeal"></i> ${names[tabId]}`;
      lucide.createIcons();
    }

    function copyToClipboard(text, id) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`¡Enlace copiado!`, text);
      });
    }

    function showToast(title, text) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'glass flex items-center p-4 rounded-2xl mb-3 shadow-2xl min-w-[280px] border-l-4 border-l-primary-lightTeal animate-toast pointer-events-auto';
      toast.innerHTML = `
                <div class="mr-3 p-2 bg-primary-teal/20 rounded-full text-primary-lightTeal">
                    <i data-lucide="check" class="w-4 h-4"></i>
                </div>
                <div>
                    <p class="text-xs font-bold text-white">${title}</p>
                    <p class="text-[10px] text-slate-400 truncate w-48">${text}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="ml-auto text-slate-500 hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-full', 'transition-all', 'duration-500');
        setTimeout(() => toast.remove(), 500);
      }, 3000);
    }

    // Initialize App
    function init() {
      // Dashboard (A mix of categories)
      const dashboardGrid = document.getElementById('content-dashboard');
      dashboardGrid.innerHTML += createCard(mathQuest[0], 'MathQuest');
      dashboardGrid.innerHTML += createCard(spaceShooter[0], 'Space Shooter');
      dashboardGrid.innerHTML += createCard(flashcards[0], 'Flashcards');
      dashboardGrid.innerHTML += createCard(mathQuest[1], 'MathQuest');
      dashboardGrid.innerHTML += createCard(spaceShooter[1], 'Space Shooter');
      dashboardGrid.innerHTML += createCard(flashcards[1], 'Flashcards');

      // Flashcards
      const fcGrid = document.getElementById('content-flashcards');
      flashcards.forEach(item => fcGrid.innerHTML += createCard(item, 'Flashcards'));

      // Games (MathQuest + Space Shooter)
      const gamesGrid = document.getElementById('content-games');
      mathQuest.forEach(item => gamesGrid.innerHTML += createCard(item, 'MathQuest'));
      spaceShooter.forEach(item => gamesGrid.innerHTML += createCard(item, 'Space Shooter'));

      // Modules
      const modulesContainer = document.getElementById('content-modules');
      courseModules.forEach(module => modulesContainer.innerHTML += createModuleSection(module));

      // Maps
      const mapsGrid = document.getElementById('content-maps');
      maps.forEach(item => mapsGrid.innerHTML += createCard(item, 'Recursos'));

      lucide.createIcons();

      // Search Logic
      const searchInput = document.getElementById('resource-search');
      searchInput.addEventListener('keyup', (e) => {
        const query = e.target.value.toLowerCase();

        // Target all resource cards and module slides
        const items = document.querySelectorAll('.glass-card, .tab-content .grid > div');

        items.forEach(item => {
          const title = (item.querySelector('h4') || item.querySelector('h5'))?.innerText.toLowerCase() || "";
          const desc = item.querySelector('p')?.innerText.toLowerCase() || "";
          if (title.includes(query) || desc.includes(query)) {
            item.style.display = item.classList.contains('glass') ? 'block' : 'flex';
          } else {
            item.style.display = 'none';
          }
        });

        // Hide module headers if no slides are visible within them
        document.querySelectorAll('#content-modules > div').forEach(section => {
          const visibleSlides = section.querySelectorAll('.grid > div:not([style*="display: none"])');
          section.style.display = visibleSlides.length > 0 || query === "" ? 'block' : 'none';
        });
      });
    }

    window.onload = init;
  </script>
</body>
